name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libudev-dev pkg-config libncurses-dev

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      # Never ship a build the test suites reject.
      - name: Test (Haskell)
        run: cabal test all

      - name: Test (Rust)
        working-directory: IronSmith-Viewer
        run: cargo test

      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Build release package (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./scripts/build-release.sh ${{ steps.version.outputs.version }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironsmith-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Package managers (winget, Scoop, Homebrew) pin each download by its
      # SHA-256, so publish them alongside the archives.
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Created as a draft so the notes can be reviewed before publishing.
      # Tags with a suffix (v1.0.0-rc.1) are marked as pre-releases.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
